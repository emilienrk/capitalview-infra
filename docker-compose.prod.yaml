services:
  db:
    image: postgres:17-alpine
    container_name: capitalview-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-capitalview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./dump_capitalview.fr.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/emilienrk/capitalview-api:latest
    container_name: capitalview-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"

  frontend:
    image: ghcr.io/emilienrk/capitalview-web:latest
    container_name: capitalview-frontend
    build:
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "8011:80"
    depends_on:
      - backend

networks:
  default:
    name: capitalview_network

volumes:
  postgres_data: